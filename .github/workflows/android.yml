name: Android release
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['android/**', 'release/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        id: version
        run: |
          version=$(sed -n 's/^versionName=//p' release/version.properties)
          code=$(sed -n 's/^versionCode=//p' release/version.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          test -s "release/v${version}.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v${version}"; fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 16 build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/release.jks
      - name: Compile and check
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease lintRelease testDebugUnitTest assembleDebugAndroidTest --no-daemon
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native interactions and audio on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd android && gradle connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/com.rachelsenglish.practice/files/screenshots app/build/native-screenshots
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk'
      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-release.*
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/native-screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: rachels-english-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Publish versioned installation package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          package="rachels-english-v${RELEASE_VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$package"
          sha256sum "$package" > "$package.sha256"
          gh release create "$GITHUB_REF_NAME" "$package" "$package.sha256" --verify-tag --title "原声练习 ${RELEASE_VERSION} · Android" --notes-file "release/v${RELEASE_VERSION}.md"
