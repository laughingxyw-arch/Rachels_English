name: Prepare encrypted native setup package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful standard Android verification run
        required: true
      source_sha:
        description: Exact source commit verified by that run
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: private-native-setup
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Verify standard build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > /tmp/verified-build.json
          jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .head_sha == $sha and .path == ".github/workflows/android.yml"' /tmp/verified-build.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Build signed private package without shared build cache
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INITIAL_SETUP_TICKET: ${{ secrets.PRIVATE_SETUP_TICKET }}
        run: |
          test -n "$KEYSTORE_B64"
          [[ "$INITIAL_SETUP_TICKET" =~ ^[a-f0-9]{64}$ ]]
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release.jks
          gradle :app:assembleRelease --no-daemon --no-build-cache --no-configuration-cache
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Encrypt before uploading any artifact
        env:
          PRIVATE_APK_KEY: ${{ secrets.PRIVATE_APK_KEY }}
        run: node scripts/encrypt_setup_apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-native-setup
          path: private-setup.apk.enc
          retention-days: 1
      - name: Remove private build outputs
        if: always()
        run: rm -rf android/app/build android/app/release.jks private-setup.apk.enc
