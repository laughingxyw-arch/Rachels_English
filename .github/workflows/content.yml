name: Validate course content
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'cloud/**', '.github/workflows/content.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_content.py
      - run: python3 scripts/check_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloud/tests/study.test.mjs
      - name: Preserve latest installation download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "${{ github.repository }}" --pattern 'rachels-english*.apk' --dir /tmp/latest-apk
            cp /tmp/latest-apk/*.apk cloud/dist/rachels-english.apk
          fi
      - name: Publish static courses when deployment token is configured
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloud
        run: |
          npx --yes wrangler@4.146.0 d1 migrations apply rachels-study --remote
          npx --yes wrangler@4.146.0 pages deploy dist --project-name rachels-english --branch main
