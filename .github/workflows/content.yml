name: Validate course content
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'cloud/wrangler.jsonc', '.github/workflows/content.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_content.py
      - run: python3 scripts/check_content.py
      - name: Publish static courses when deployment token is configured
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.146.0 pages deploy cloud/dist --project-name rachels-english --branch main
