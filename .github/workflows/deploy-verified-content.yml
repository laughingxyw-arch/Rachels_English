name: Deploy verified practice content
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android release run to publish
        required: true
      source_sha:
        description: Exact source commit verified by that run
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: deploy-verified-practice
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > build.json
          jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .head_sha == $sha and .path == ".github/workflows/android.yml"' build.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Build public content with the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n rachels-english-apk -D package
          mkdir -p downloads
          cp package/app-release.apk downloads/rachels-english.apk
          python3 scripts/check_content.py
          python3 scripts/build_content.py
          sha256sum downloads/rachels-english.apk
      - name: Deploy public content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.146.0 pages deploy cloud/dist --project-name rachels-english --branch main
