<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark"><title>验证通行密钥 · 原声练习</title><style>body{font:17px/1.65 system-ui;max-width:28rem;margin:16vh auto;padding:24px}h1{font-size:27px;font-weight:550}a{display:inline-block;color:#2484cd;padding:12px 0;text-decoration:none}p{opacity:.7}button{font:inherit;border:0;background:transparent;color:#2484cd;padding:12px 0;cursor:pointer}a[aria-disabled="true"]{opacity:.4;cursor:default}</style><h1>验证通行密钥</h1><p id="status">在已安装的应用中继续，使用系统通行密钥完成验证。</p><a id="open" role="link" aria-disabled="true">打开应用</a><script>
const valid=value=>typeof value==='string'&&/^[a-f0-9]{64}$/.test(value);
let ticket=location.hash.slice(1);
const storageKey='pending-'+location.pathname;
try {
 if(valid(ticket))sessionStorage.setItem(storageKey,JSON.stringify({ticket,expires:Date.now()+1800000}));
 else {const cached=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(cached&&cached.expires>Date.now()&&valid(cached.ticket))ticket=cached.ticket;}
}catch{}
const button=document.getElementById('open');
if(!valid(ticket)){document.getElementById('status').textContent='当前页面未读取到绑定信息，请重新点击聊天中的私有绑定链接。';}
else {
 button.removeAttribute('aria-disabled');
 button.href='intent://rachels-english.pages.dev/passkey-probe/#Intent;scheme=https;package=com.rachelsenglish.passkeyprobe;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.enrollment='+ticket+';end';
 let pending=null;
 const clearPending=()=>{clearTimeout(pending);pending=null;};
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')clearPending();});
 window.addEventListener('pagehide',clearPending);
 button.addEventListener('click',()=>{
  clearPending();
  pending=setTimeout(()=>{
   if(document.visibilityState==='visible')document.getElementById('status').textContent='如果应用没有打开，请检查小米浏览器是否允许网页打开其他应用，或在 Chrome 中打开本页。请确认已安装 2.1.19 或更新版。';
  },1500);
 });
}
</script></html>
